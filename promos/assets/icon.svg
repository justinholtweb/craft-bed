<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf.

  The mark is a bed in side elevation: headboard, mattress, two feet, and a pillow punched out of
  the mattress with fill-rule="evenodd" rather than drawn in a second colour. The pillow is the
  tile showing through, so the whole mark stays one white mass and cannot turn to mud at 32px.

  Headboard, mattress and feet are separate elements on purpose. Under evenodd, two overlapping
  subpaths of one path cancel each other out — the headboard would punch a notch through the
  mattress exactly where the two meet. Separate elements simply union.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Bed">
  <!-- Rounded tile: 22.44% radius, matching Appleseed's rx="35" on a 156px square -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#3B4B9A"/>

  <!-- Headboard -->
  <rect x="14" y="23" width="10" height="44" rx="5" fill="#FEFEFE"/>

  <!-- Mattress, with the pillow punched out of it -->
  <path fill="#FEFEFE" fill-rule="evenodd" d="
    M20,41 H76 A10,10 0 0 1 86,51 V67 H20 Z
    M33,46 H47 A3,3 0 0 1 50,49 V53 A3,3 0 0 1 47,56 H33 A3,3 0 0 1 30,53 V49 A3,3 0 0 1 33,46 Z
  "/>

  <!-- Feet -->
  <rect x="16" y="67" width="9" height="10" rx="3" fill="#FEFEFE"/>
  <rect x="76" y="67" width="9" height="10" rx="3" fill="#FEFEFE"/>
</svg>
